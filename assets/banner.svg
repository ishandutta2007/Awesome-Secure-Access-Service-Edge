<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pulse-circle {
        animation: pulse 3s ease-in-out infinite;
      }
      .dash-line {
        stroke-dasharray: 8 6;
        animation: dashMove 12s linear infinite;
      }
      .glow-text {
        animation: textFlicker 4s ease-in-out infinite alternate;
      }
      .node-pulse {
        animation: nodeBlink 2.5s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes textFlicker {
        0% { filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.4)); }
        100% { filter: drop-shadow(0 0 28px rgba(139, 92, 246, 0.85)); }
      }
      @keyframes nodeBlink {
        0% { r: 6px; fill: #38bdf8; }
        100% { r: 9px; fill: #c084fc; }
      }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <g transform="translate(980, 210)">
    <circle r="140" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" stroke-dasharray="6 4" class="dash-line" />
    <circle r="105" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.35" />
    <circle r="70" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.5" stroke-dasharray="10 6" class="dash-line" />
    <circle r="30" fill="url(#glowGrad)" opacity="0.3" class="pulse-circle" />

    <path d="M 0 -35 L 28 -18 L 28 15 C 28 32 0 45 0 45 C 0 45 -28 32 -28 15 L -28 -18 Z" 
          fill="none" stroke="url(#accentCyan)" stroke-width="3.5" filter="url(#glow)"/>
    <path d="M -10 3 L -2 11 L 12 -5" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g stroke="url(#glowGrad)" stroke-width="2" fill="none">
    <path d="M 80 80 Q 220 180 340 100 T 640 120 T 980 210" class="dash-line" opacity="0.45" />
    <path d="M 120 340 Q 300 240 500 310 T 800 290 T 980 210" class="dash-line" opacity="0.45" />
  </g>

  <g>
    <circle cx="80" cy="80" r="5" fill="#38bdf8" opacity="0.7" />
    <circle cx="340" cy="100" r="6" fill="#818cf8" opacity="0.8" />
    <circle cx="640" cy="120" r="7" class="node-pulse" />
    <circle cx="120" cy="340" r="5" fill="#06b6d4" opacity="0.7" />
    <circle cx="500" cy="310" r="6" fill="#a855f7" opacity="0.8" />
    <circle cx="800" cy="290" r="7" class="node-pulse" />
  </g>

  <g transform="translate(80, 75)">
    <rect width="250" height="30" rx="15" fill="#0f2942" stroke="#0ea5e9" stroke-width="1.2" opacity="0.9"/>
    <text x="125" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.2">
      ZERO TRUST ARCHITECTURE
    </text>
  </g>

  <g transform="translate(80, 155)" class="glow-text">
    <text fill="url(#accentCyan)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-0.5">
      Awesome SASE Ecosystem
    </text>
  </g>

  <g transform="translate(80, 195)">
    <text fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400">
      Secure Access Service Edge • ZTNA • SSE • SD-WAN • CASB • Cloud SWG
    </text>
  </g>

  <g transform="translate(80, 250)">
    <g transform="translate(0, 0)">
      <rect width="170" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="85" y="24" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Top SaaS Platforms</text>
    </g>
    <g transform="translate(185, 0)">
      <rect width="190" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="95" y="24" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Open-Source Mesh</text>
    </g>
    <g transform="translate(390, 0)">
      <rect width="210" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="105" y="24" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Transparent Pricing &amp; Tier</text>
    </g>
  </g>

  <g transform="translate(80, 340)">
    <text fill="#64748b" font-family="sans-serif" font-size="15" font-weight="500">
      Curated ecosystem of enterprise SASE solutions, self-hosted overlays, and identity-driven mesh networks.
    </text>
  </g>
</svg>
